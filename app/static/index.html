<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OLT Management</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1c2430; --muted:#667085; --line:#e3e6eb; --accent:#1f6feb; --ok:#13795b; --bad:#b42318; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12161c; --card:#1a2029; --ink:#e8ecf1; --muted:#9aa5b4; --line:#2a3340; --accent:#5a9bff; --ok:#46c29a; --bad:#ff7b70; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  form { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  input, select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 6px; padding: 7px 12px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--bad); }
  .actions { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  td.row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .msg { font-size: 13px; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  textarea { width: 100%; min-height: 280px; font: 12.5px/1.5 ui-monospace, monospace; resize: vertical; }
  ul.notes { color: var(--muted); font-size: 13px; padding-left: 18px; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1>OLT Management</h1>
  <p class="sub">Alta de OLTs, prueba de conexión y script de enlace con el MikroTik.</p>

  <section class="card">
    <h2>Agregar OLT</h2>
    <form id="add-form">
      <label>Nombre<input name="name" required pattern="[A-Za-z0-9 _.\-]{1,80}" placeholder="OLT-Centro"></label>
      <label>Marca<select name="vendor" id="vendor"></select></label>
      <label>Modelo<input name="model" placeholder="DS-P7001-08"></label>
      <label>IP de gestión<input name="host" required placeholder="172.20.5.2"></label>
      <label>Protocolo
        <select name="protocol" id="protocol"><option>ssh</option><option>telnet</option><option>snmp</option></select>
      </label>
      <label>Puerto<input name="port" type="number" min="1" max="65535" id="port" placeholder="22"></label>
      <label>Usuario<input name="username" autocomplete="off"></label>
      <label>Contraseña<input name="password" type="password" autocomplete="new-password"></label>
      <div class="actions">
        <button class="primary" type="submit">Agregar OLT</button>
        <span class="msg" id="add-msg"></span>
      </div>
    </form>
  </section>

  <section class="card">
    <h2>OLTs registradas</h2>
    <table>
      <thead><tr><th>Nombre</th><th>Marca / modelo</th><th>Acceso</th><th>Estado</th><th></th></tr></thead>
      <tbody id="olts"></tbody>
    </table>
    <p class="sub hidden" id="empty">Todavía no hay OLTs registradas.</p>
  </section>

  <section class="card hidden" id="mk-card">
    <h2>Script MikroTik para <span id="mk-olt"></span></h2>
    <p class="sub">Solo se genera: revísalo y pégalo tú en el router (Terminal). Es seguro volver a correrlo.</p>
    <form id="mk-form">
      <label>IP de este sistema (el LXC)<input name="system_ip" required placeholder="192.168.88.50"></label>
      <label>Puerto del MikroTik hacia la OLT<input name="trunk_interface" required placeholder="ether2"></label>
      <label>VLAN de gestión<input name="vlan_id" type="number" min="1" max="4094" required value="250"></label>
      <label>IP del MikroTik en esa VLAN<input name="gateway_ip" required placeholder="172.20.5.1"></label>
      <label>Prefijo<input name="prefix" type="number" min="8" max="30" required value="28"></label>
      <label>Bridge (solo si usa vlan-filtering)<input name="bridge" placeholder="bridge1"></label>
      <label style="flex-direction:row;align-items:center;gap:8px">
        <input type="checkbox" name="masquerade" checked> Masquerade hacia la OLT
      </label>
      <div class="actions">
        <button class="primary" type="submit">Generar script</button>
        <span class="msg" id="mk-msg"></span>
      </div>
    </form>
    <div id="mk-out" class="hidden">
      <textarea id="mk-script" readonly></textarea>
      <div class="actions" style="margin-top:8px"><button id="mk-copy" type="button">Copiar</button></div>
      <ul class="notes" id="mk-notes"></ul>
    </div>
  </section>
</main>

<script>
const DEFAULT_PORTS = { ssh: 22, telnet: 23, snmp: 161 };
let currentOlt = null;

async function api(path, opts = {}) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  if (res.status === 204) return null;
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const d = data.detail;
    throw new Error(typeof d === "string" ? d : Array.isArray(d) ? d.map(e => e.loc.slice(1).join(".") + ": " + e.msg).join("; ") : "Error " + res.status);
  }
  return data;
}

function setMsg(el, text, ok) { el.textContent = text; el.className = "msg " + (ok ? "ok" : "bad"); }

document.getElementById("protocol").addEventListener("change", e => {
  document.getElementById("port").placeholder = DEFAULT_PORTS[e.target.value];
});

async function loadVendors() {
  const sel = document.getElementById("vendor");
  for (const v of await api("/vendors")) sel.add(new Option(v, v));
}

async function loadOlts() {
  const tbody = document.getElementById("olts");
  tbody.replaceChildren();
  const olts = await api("/olts");
  document.getElementById("empty").classList.toggle("hidden", olts.length > 0);
  for (const o of olts) {
    const tr = tbody.insertRow();
    tr.insertCell().textContent = o.name;
    tr.insertCell().textContent = o.vendor + (o.model ? " " + o.model : "");
    tr.insertCell().textContent = `${o.protocol}://${o.host}:${o.port}`;
    const st = tr.insertCell(); st.className = "msg"; st.textContent = "—";
    const act = tr.insertCell(); act.className = "row-actions";
    const bTest = Object.assign(document.createElement("button"), { textContent: "Probar conexión" });
    bTest.onclick = async () => {
      st.textContent = "probando…"; st.className = "msg";
      try {
        const r = await api(`/olts/${o.id}/test`, { method: "POST" });
        setMsg(st, r.reachable === null ? r.detail : r.reachable ? `Responde (${r.latency_ms} ms)` : r.detail, r.reachable !== false);
      } catch (e) { setMsg(st, e.message, false); }
    };
    const bMk = Object.assign(document.createElement("button"), { textContent: "Script MikroTik" });
    bMk.onclick = () => openMikrotik(o);
    const bDel = Object.assign(document.createElement("button"), { textContent: "Eliminar", className: "danger" });
    bDel.onclick = async () => {
      if (!confirm(`¿Quitar "${o.name}" del sistema? No toca la OLT física.`)) return;
      try { await api(`/olts/${o.id}`, { method: "DELETE" }); loadOlts(); }
      catch (e) { setMsg(st, e.message, false); }
    };
    act.append(bTest, bMk, bDel);
  }
}

document.getElementById("add-form").addEventListener("submit", async e => {
  e.preventDefault();
  const f = new FormData(e.target), msg = document.getElementById("add-msg");
  const body = Object.fromEntries(f);
  body.port = body.port ? Number(body.port) : null;
  try {
    await api("/olts", { method: "POST", body: JSON.stringify(body) });
    e.target.reset(); setMsg(msg, "OLT agregada", true); loadOlts();
  } catch (err) { setMsg(msg, err.message, false); }
});

function openMikrotik(olt) {
  currentOlt = olt;
  document.getElementById("mk-olt").textContent = olt.name;
  document.getElementById("mk-card").classList.remove("hidden");
  document.getElementById("mk-out").classList.add("hidden");
  document.getElementById("mk-card").scrollIntoView({ behavior: "smooth" });
}

document.getElementById("mk-form").addEventListener("submit", async e => {
  e.preventDefault();
  const f = new FormData(e.target), msg = document.getElementById("mk-msg");
  const body = Object.fromEntries(f);
  body.vlan_id = Number(body.vlan_id); body.prefix = Number(body.prefix);
  body.masquerade = e.target.elements.masquerade.checked;
  try {
    const r = await api(`/olts/${currentOlt.id}/mikrotik-script`, { method: "POST", body: JSON.stringify(body) });
    document.getElementById("mk-script").value = r.script;
    const ul = document.getElementById("mk-notes"); ul.replaceChildren();
    for (const n of r.notes) ul.append(Object.assign(document.createElement("li"), { textContent: n }));
    document.getElementById("mk-out").classList.remove("hidden");
    setMsg(msg, "Script generado", true);
  } catch (err) { setMsg(msg, err.message, false); }
});

document.getElementById("mk-copy").addEventListener("click", async () => {
  const ta = document.getElementById("mk-script");
  try { await navigator.clipboard.writeText(ta.value); } catch { ta.select(); document.execCommand("copy"); }
});

loadVendors().then(loadOlts);
</script>
</body>
</html>
