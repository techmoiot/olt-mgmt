<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ritsuko - Dashboard</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body data-page="dashboard" data-title="Dashboard">
<main id="main" class="hidden">
<section class="hero">
  <div class="hero-head">
    <span class="hero-total" id="hero-total">0</span>
    <span class="hero-label">ONUs en el sistema</span>
    <span class="spacer"></span>
    <span class="hint" id="updated"></span>
    <button id="refresh" type="button">Actualizar</button>
  </div>
  <div class="fiberbar" id="fiberbar" role="img" aria-label="Distribución de ONUs por estado"></div>
  <div class="legend" id="legend"></div>
</section>
<div class="facts" id="facts"></div>
</main>
<script src="/static/common.js"></script>
<script src="/static/js/dashboard.js"></script>
</body>
</html>
