<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ritsuko - Usuarios</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body data-page="usuarios" data-title="Usuarios" data-admin="1">
<main id="main" class="hidden">
<section class="card">
  <p class="sub">Quién puede entrar. El operador autoriza y suspende ONUs; solo el administrador gestiona OLTs, MikroTik, planes, usuarios y auditoría.</p>
  <form id="user-form">
    <label>Usuario<input name="username" required pattern="[a-z0-9._-]{3,32}" autocomplete="off" placeholder="juan"></label>
    <label>Contraseña inicial<input name="password" type="password" required minlength="10" autocomplete="new-password"></label>
    <label>Rol<select name="role"><option value="operator">Operador</option><option value="admin">Administrador</option></select></label>
    <div class="actions"><button class="primary" type="submit">Crear usuario</button><span class="msg" id="user-msg"></span><span class="hint">Mínimo 10 caracteres. Tendrá que cambiarla al primer ingreso.</span></div>
  </form>
  <div class="table-wrap"><table>
    <thead><tr><th>Usuario</th><th>Rol</th><th>Estado</th><th>Último ingreso</th><th></th></tr></thead>
    <tbody id="users"></tbody>
  </table></div>
</section>
</main>
<script src="/static/common.js"></script>
<script src="/static/js/usuarios.js"></script>
</body>
</html>
